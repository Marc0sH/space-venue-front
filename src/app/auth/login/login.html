<div class="loginContainer">
    <h2>Inicio de sesion</h2>

    <form (submit)="onSubmit($event)">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Username" [formField]="loginForm.username"/>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Password" [formField]="loginForm.password"/>
        </div>

        <button type="submit" [disabled]="loginForm().invalid() || loading()">Login</button>
    </form>

    @if (error() != "") {
        <p class="error">{{error()}}</p>
    }

    <app-form-error-message [campo]="loginForm.username()"></app-form-error-message>
    <app-form-error-message [campo]="loginForm.password()"></app-form-error-message>

    <h3>¿No tenes cuenta? <a routerLink="/registro">Registrate</a></h3>
</div>
