<div class="register-container">
    <h2>Registro de usuario</h2>

    <form (submit)="onSubmit($event)">
        <div class="form-group">
            <label for="firstname">Primer Nombre</label>
            <input type="text" placeholder="Primer Nombre" [formField]="formRegister.firstname" />
        </div>
        
        <div class="form-group">
            <label for="lastname">Apellido</label>
            <input type="text" placeholder="Apellido" [formField]="formRegister.lastname" />
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" placeholder="Email" [formField]="formRegister.email" />
        </div>

        <div class="form-group">
            <label for="phone">Teléfono</label>
            <input type="tel" placeholder="Teléfono" [formField]="formRegister.phone" />
        </div>

        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" placeholder="Nombre de usuario" [formField]="formRegister.username" />
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" placeholder="Contraseña" [formField]="formRegister.password" />
        </div>

        <button type="submit" [disabled]="formRegister().invalid()">Registrarse</button>

        @if (error() != "") {
            <p class="error">{{error()}}</p>
        }

        <app-form-error-message [campo]="formRegister.firstname()"></app-form-error-message>
        <app-form-error-message [campo]="formRegister.lastname()"></app-form-error-message>
        <app-form-error-message [campo]="formRegister.email()"></app-form-error-message>
        <app-form-error-message [campo]="formRegister.phone()"></app-form-error-message>
        <app-form-error-message [campo]="formRegister.username()"></app-form-error-message>
        <app-form-error-message [campo]="formRegister.password()"></app-form-error-message>
    </form>

    <p class="registro">¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
</div>
