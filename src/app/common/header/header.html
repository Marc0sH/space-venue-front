<header>
    <h1>Space&Venue</h1>

    <nav class="commonPaths">
        <a routerLink="/espacios">Lista de espacios</a>
    
        @if (sessionService.isLoggedIn()) {
            <a routerLink="/espacios/crear">Crear un espacio</a>
            <a routerLink="/espacios/espaciospropios">Mis espacios</a>
            <button class="redBtn" (click)="sessionService.logoutUser()">Cerrar sesión</button>
        }@else {
            <a routerLink="/login">Iniciar sesión</a>
        }
    </nav>

</header>
