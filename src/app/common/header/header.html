<header>
    <h1 (click)="navigate()" class="nombre">Space&Venue</h1>

    <nav class="commonPaths">


    
        @if (sessionService.isLoggedIn()) {
            <a routerLink="/espacios/crear">Crear un espacio</a>
            <a routerLink="/espacios/espaciospropios">Mis espacios</a>
            <a routerLink="/perfil">Mi perfil</a>
            @if(notificaciones().value() == undefined){
                <a routerLink="/notificaciones"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope-open-fill" viewBox="0 0 16 16">
  <path d="M8.941.435a2 2 0 0 0-1.882 0l-6 3.2A2 2 0 0 0 0 5.4v.314l6.709 3.932L8 8.928l1.291.718L16 5.714V5.4a2 2 0 0 0-1.059-1.765zM16 6.873l-5.693 3.337L16 13.372v-6.5Zm-.059 7.611L8 10.072.059 14.484A2 2 0 0 0 2 16h12a2 2 0 0 0 1.941-1.516M0 13.373l5.693-3.163L0 6.873z"/>
</svg></a>}
            @else {<a routerLink="/notificaciones"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-envelope-arrow-down-fill" viewBox="0 0 16 16">
  <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zm.192 8.159 6.57-4.027L8 9.586l1.239-.757.367.225A4.49 4.49 0 0 0 8 12.5c0 .526.09 1.03.256 1.5H2a2 2 0 0 1-1.808-1.144M16 4.697v4.974A4.5 4.5 0 0 0 12.5 8a4.5 4.5 0 0 0-1.965.45l-.338-.207z"/>
  <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m.354-1.646a.5.5 0 0 1-.722-.016l-1.149-1.25a.5.5 0 1 1 .737-.676l.28.305V11a.5.5 0 0 1 1 0v1.793l.396-.397a.5.5 0 0 1 .708.708z"/>
</svg> {{notificaciones().value()}} </a>}
            
            <button class="redBtn" (click)="sessionService.logoutUser()">Cerrar sesión</button>
        }@else {
            <a routerLink="/espacios">Lista de espacios</a>
            <a routerLink="/login">Iniciar sesión</a>
        }
    </nav>

</header>

@if (showScrollTop()) {
    <button class="scrollTopBtn" type="button" aria-label="Volver arriba" title="Volver arriba" (click)="scrollToTop()">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path fill-rule="evenodd" d="M8 12a.5.5 0 0 0 .5-.5V5.707l2.146 2.147a.5.5 0 0 0 .708-.708l-3-3a.5.5 0 0 0-.708 0l-3 3a.5.5 0 1 0 .708.708L7.5 5.707V11.5A.5.5 0 0 0 8 12"/>
        </svg>
    </button>
}
