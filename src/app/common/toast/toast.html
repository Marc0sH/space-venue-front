<dialog #dialog class="toast-dialog" aria-labelledby="toast-dialog-title" aria-describedby="toast-dialog-text"
    (cancel)="onCancel($event)">
    <div class="toast-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
        </svg>
    </div>
    <h2 id="toast-dialog-title">¡Listo!</h2>
    <p id="toast-dialog-text">{{ actual()?.text }}</p>
    <div class="toast-dialog-actions">
        <button type="button" class="accept-button" autofocus (click)="cerrar()">Aceptar</button>
    </div>
</dialog>
