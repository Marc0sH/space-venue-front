<button type="button" class="ubicacion-actual" (click)="usarUbicacionActual()" [disabled]="disabled() || buscando()">
    <span class="material-symbols-outlined" aria-hidden="true">my_location</span>
    {{buscando() ? 'Buscando tu ubicación...' : 'Usar mi ubicación actual'}}
</button>

@if (errorUbicacion() != "") {
    <p class="error" role="alert">{{errorUbicacion()}}</p>
}

<div #mapa class="mapa" aria-label="Mapa para elegir la ubicación del espacio"></div>

<p class="ayuda">Hacé clic en el mapa para marcar la ubicación. Podés arrastrar el marcador para ajustarla.</p>
