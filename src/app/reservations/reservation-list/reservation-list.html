<section class="reservations-list">
    @if (isLoading()) {
        <p class="list-message">Cargando reservas...</p>
    } @else if (error()) {
        <p class="list-message fail">Hubo un error al cargar las reservas: {{error()}}</p>
    } @else if (reservationsOfActualUser()) {
        @for (r of reservationsOfActualUser(); track r.id) {
            <app-reservation-card [reservation]="r"></app-reservation-card>
        }
    }
</section>
