
<div class="SpaceCard" (click)="navigate()" [class.inactivo]="!space().isActive">
        @if(firstImage(); as image){
          <div class="gallery">
         <img [src]="service.imageUrl(image.urlImage)" [alt]="image.fileName" loading="lazy">  
          </div>
        }
        @else {
          <p>No hay imagenes cargadas</p>
        }
        <div>
    <div class="card-header">
          <h3>{{ formatName(space().nameSpace) }}</h3>
      <span class="status-badge" [class.active]="space().isActive">
      {{ space().isActive ? 'Aprobado' : etiquetaEstado(space()) }}
    </span>
        </div>
    
  </div>

  <p class="price">${{ space().basePrice }}</p>
</div>
