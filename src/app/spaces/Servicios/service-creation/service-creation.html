<section class="service-creation">
    <h3>Agregar servicio</h3>

    <div>
        <div>
            <label for="description">Descripcion</label>
            <input (keydown.enter)="$event.preventDefault(); addService()" type="text" [formField]="serviceForm.description" (input)="updateDescription($any($event.target).value)">
        </div>
        
        <div>
            <label for="price">Precio</label>
            <input (keydown.enter)="$event.preventDefault(); addService()" type="number" [formField]="serviceForm.price" (input)="updatePrice($any($event.target).value)">
            
        </div>

        <button type="button" (click)="addService()">Agregar servicio</button>

        @if (showErrors()) {
            <app-form-error-message [campo]="serviceForm.description()"></app-form-error-message>
            <app-form-error-message [campo]="serviceForm.price()"></app-form-error-message>
        }
    </div>
</section>
