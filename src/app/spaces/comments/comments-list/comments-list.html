<section class="comments-list" aria-label="Reseñas del espacio">
    @if (comments.error()) {
        <p class="list-message error" role="alert">No se pudieron cargar las reseñas.</p>
    } @else if (comments.isLoading()) {
        <p class="list-message" role="status">Cargando reseñas...</p>
    } @else if (comments.hasValue()) {
        @for (c of comments.value(); track c.idComment) {
            <app-comment-view-card [comment]="c" (deleted)="onDeleted($event)"></app-comment-view-card>
        } @empty {
            <p class="list-message">Todavía no hay reseñas para este espacio.</p>
        }
    } 
</section>
