@if (cargando()) {
    <div class="loading-container">
        <p>Cargando espacios...</p>
    </div>
} @else if (error()) {
    <div class="error-container">
        <p class="error">{{ error() }}</p>
    </div>
} @else {
    <section class="spaces-section">
        <app-space-filter (ordenSalida)="cambiarOrden($event)"></app-space-filter>
 
        <div class="spaces-grid">
            @for (s of spacesOrdenados(); track s.idSpace) {
                <app-spacescard [space]="s"></app-spacescard>
            }
        </div>
    </section>
}
