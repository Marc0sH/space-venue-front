<div class="filters">
    @if (conCercania()) {
        <div class="nearby-container">
            <label for="radio">Distancia: </label>
            <select id="radio" (change)="seleccionarRadio($event)">
                @for (r of radios; track r) {
                    <option [value]="r" [selected]="r === radioKm()">Hasta {{ r }} km</option>
                }
            </select>

            <button type="button" class="nearby-button" [attr.aria-expanded]="mostrarMapa()"
                aria-controls="ubicacion-referencia" (click)="alternarMapa()">
                {{ mostrarMapa() ? 'Ocultar mapa' : (ubicacion() ? 'Cambiar ubicación' : 'Buscar cerca de una ubicación') }}
            </button>

            @if (ubicacion()) {
                <button type="button" class="nearby-button active" (click)="quitarCercania()">
                    Quitar filtro de cercanía
                </button>
            }
        </div>
    }

    <div class="sort-container">
        <label for="orden">Ordenar: </label>
        <select id="orden" (change)="seleccionarOrden($event)">
            <option value="Sin ordenar">Sin ordenar</option>
            <option value="Precio">Precio (Menor a Mayor)</option>
            <option value="Nombre">Nombre (A-Z)</option>
      </select>
    </div>
</div>

@if (conCercania() && mostrarMapa()) {
    <div id="ubicacion-referencia" class="nearby-picker">
        <p class="nearby-picker-title">Ubicación de referencia</p>
        <app-location-picker [value]="ubicacion()" (valueChange)="elegirUbicacion($event)"></app-location-picker>
    </div>
}
