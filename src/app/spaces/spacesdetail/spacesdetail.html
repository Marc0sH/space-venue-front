@if (space.isLoading()) {
  <div class="status-message">
    <p>Cargando...</p>
  </div>
} @else if (space.error()) {
  <div class="status-message error">
    <p>No se pudo cargar el espacio</p>
  </div>
} @else if (space.value(); as s) {
  <div class="spaceDetail">
    <h2>{{ s.nameSpace }}</h2>
    <p class="price">${{ s.basePrice }}</p>
    
    <div class="info-group">
      <p><strong>Descripción:</strong> {{ s.description }}</p>
      <p class="meta-date"><strong>Publicado:</strong> {{ s.publicationDate }}</p> 
      
    </div>
  </div>
}
