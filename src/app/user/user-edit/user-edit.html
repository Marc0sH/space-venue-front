<div class="register-container">
  <h2>Editar perfil</h2>

  @if (perfil.isLoading()) {
    <p>Cargando...</p>
  } @else if (perfil.error()) {
    <p class="error">No se pudo cargar el perfil</p>
  } @else {
    <form (submit)="onSubmit($event)">
      <div class="form-group">
        <label>Nombre de usuario</label>
        <input type="text" [value]="perfil.value()?.credentials?.username" disabled />
      </div>

      <div class="form-group">
        <label for="firstname">Nombre</label>
        <input id="firstname" type="text" placeholder="Nombre" [formField]="formEdit.firstname" />
      </div>

      <div class="form-group">
        <label for="lastname">Apellido</label>
        <input id="lastname" type="text" placeholder="Apellido" [formField]="formEdit.lastname" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Email" [formField]="formEdit.email" />
      </div>

      <div class="form-group">
        <label for="phone">Teléfono</label>
        <input id="phone" type="tel" placeholder="Teléfono" [formField]="formEdit.phone" />
      </div>

      <button type="submit" [disabled]="formEdit().invalid() || !formEdit().dirty() || guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar cambios' }}
      </button>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <app-form-error-message [campo]="formEdit.firstname()"></app-form-error-message>
      <app-form-error-message [campo]="formEdit.lastname()"></app-form-error-message>
      <app-form-error-message [campo]="formEdit.email()"></app-form-error-message>
      <app-form-error-message [campo]="formEdit.phone()"></app-form-error-message>
    </form>

    <p class="registro"><a routerLink="/perfil">Cancelar y volver al perfil</a></p>
  }
</div>
