<button type="button" class="notificacioncard"
        [class.is-seen]="notification().isSeen"
        [class.selected]="selected()"
        (click)="cambiarEstado()">
    <span class="notification-image">
        <span class="material-symbols-outlined">notifications</span>
    </span>
    <span class="content-item-main">
        <span class="notification-message">{{notification().message}}</span>
        <time>{{notification().createdAt | date:'dd/MM/yyyy HH:mm'}}</time>
    </span>
    @if (!notification().isSeen) {
        <span class="unseen-dot" aria-label="Sin leer"></span>
    }
</button>
