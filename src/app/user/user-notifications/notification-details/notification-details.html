@if (notification(); as n) {
    <div class="detail-header">
        <button type="button" class="back-btn" (click)="volver.emit()">
            <span class="material-symbols-outlined">arrow_back</span>
            <span>Atrás</span>
        </button>

        <div class="notification-image">
            <span class="material-symbols-outlined">notifications</span>
        </div>

        <div class="detail-title">
            <div class="subject-container">Notificación</div>
            <time>{{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}</time>
        </div>
    </div>

    <div class="detail-content">
        <p>{{ n.message }}</p>
    </div>
} @else {
    <div class="empty-detail">
        <span class="material-symbols-outlined">mark_email_unread</span>
        <p>Seleccioná una notificación de la lista para ver más detalles</p>
    </div>
}
